        "409": { description: Відзнаку вже видано — потрібен force }
  /api/admin/badges/{badgeId}/award:
    post:
      tags: [admin]
      summary: Масова видача ручної відзнаки (посади, території, люди)
      security: [{ adminSession: [] }]
      parameters: [{ name: badgeId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/rating:
    get:
      tags: [admin]
      summary: Правила рейтингу (ваги) і рівні
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Змінити правила рейтингу й рівні
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/rating/recalculate:
    post:
      tags: [admin]
      summary: Стерти журнал балів і перерахувати всіх за поточними правилами
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/notifications/broadcast:
    get:
      tags: [admin]
      summary: Історія ручних розсилок (останні 50)
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Надіслати ручну розсилку (канали push/Telegram на вибір)
      security: [{ adminSession: [] }]
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [admin]
      summary: Відкликати розсилки — `{ids}`; сповіщення зникають із центрів адресатів (доставлений push відкликати не можна)
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/telegram:
    get:
      tags: [admin]
      summary: Стан Telegram-бота — токен, webhook, прив'язки, вхідні
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: "Дія з ботом — `{action: \"webhook\"}` зареєструвати webhook, `{action: \"test\", employeeId}` тестове повідомлення"
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [admin]
      summary: Відв'язати Telegram у співробітників — `{employeeIds}`
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/tokens:
    get:
      tags: [admin]
      summary: Токени Power Query
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Видати токен Power Query (показується один раз)
      security: [{ adminSession: [] }]
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/tokens/{tokenId}:
    delete:
      tags: [admin]
      summary: Відкликати токен Power Query
      security: [{ adminSession: [] }]
      parameters: [{ name: tokenId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------- data (Power Query) — зовнішній контракт
  /api/data/employees:
    get:
      tags: [data]
      summary: Співробітники для живої Excel-книги
      security: [{ apiToken: [] }]
      responses:
        "200":
          description: Усі співробітники за id
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DataEmployee" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/data/courses:
    get:
      tags: [data]
      summary: Курси для живої Excel-книги
      security: [{ apiToken: [] }]
      responses:
        "200":
          description: Усі курси за id
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DataCourse" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/data/enrollments:
    get:
      tags: [data]
      summary: Призначення для живої Excel-книги
      security: [{ apiToken: [] }]
      responses:
        "200":
          description: Усі призначення за id
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DataEnrollment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------- telegram — зовнішній контракт
  /api/telegram/webhook:
    post:
      tags: [telegram]
      summary: Webhook бота — /start (прив'язати чат), /stop, інше → журнал вхідних
      description: Завжди 200 (крім невірного секрету) — інакше Telegram повторює апдейт безкінечно.
      security: [{ telegramSecret: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/TelegramUpdate" } } }
      responses:
        "200":
          description: Прийнято
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reason: { type: string, enum: [not_configured] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tg/overview:
    post:
      security: []
      tags: [telegram]
      summary: Дані Mini App — курси співробітника або команда керівника
      description: Авторизація — підписаний Telegram `initData` у тілі (lib/telegramLogic.ts verifyInitData), не cookie.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { initData: { type: string } }
              required: [initData]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/tg/remind:
    post:
      security: []
      tags: [telegram]
      summary: «Нагадати» одній людині з Mini App готовим шаблоном
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                initData: { type: string }
                employeeId: { type: integer }
                courseSlug: { type: string }
                reason: { type: string }
              required: [initData, employeeId, reason]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------- system
  /api/cron/check-overdue-enrollments:
    get:
      tags: [system]
      summary: Щоденний cron о 9:00 за Києвом — прострочення, публікація й доназначення курсів, нагадування, авто-відзнаки, дайджести
      description: |
        Кожен крок ідемпотентний (dedupeKey / skipDuplicates) — повторний запуск нічого не дублює.
        Vercel викликає його о 06:00 і 07:00 UTC; працює лише виклик, що припав на 9-ту годину за Києвом
        (літній/зимовий час), інший повертає `{skipped: true}`. `?force=1` — ручний запуск будь-коли.
      security: [{ cronSecret: [] }]
      parameters:
        - { name: force, in: query, schema: { type: string, enum: ["1"] }, description: Запустити незалежно від години }
      responses:
        "200":
          description: Підсумок кроків
          content: { application/json: { schema: { $ref: "#/components/schemas/CronResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Один із кроків упав (решта виконались)
          content: { application/json: { schema: { $ref: "#/components/schemas/CronResult" } } }
  /api/health:
    get:
      tags: [system]
      summary: Перевірка після деплою — анонімно лише `{ok}`, з admin_session ще стан бази й каналів
      security: [{}, { adminSession: [] }]
      responses:
        "200":
          description: Живий
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
        "503":
          description: База недоступна (лише з admin_session)
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
