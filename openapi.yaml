openapi: 3.1.0
info:
  title: CarLS — Carlsberg Learning & Support API
  version: 1.0.0
  description: |
    Опис усіх Route Handlers з `app/api/**/route.*` (2026-10-04).

    **Правило:** новий або змінений ендпоінт = правка цього файлу в тому ж PR.
    `lib/openapi.test.ts` валить CI, якщо роут і цей файл розходяться
    (шлях або метод є лише з одного боку), а `oasdiff` у PR позначає
    ламаючі зміни описаних контрактів.

    Повні схеми тіл — для зовнішніх контрактів (Power Query `/api/data/*`,
    Telegram, cron, health) і для відповіді на питання / завершення модуля.
    Решта (адмінка, кабінет) — шлях, метод, авторизація й коди відповідей:
    їхні клієнти живуть у цьому ж репозиторії й перевіряються рев'ю коду.

    Перегляд — `/admin/api` (Swagger UI, лише для супер-адміна).
servers:
  - url: /
tags:
  - name: auth
    description: Вхід співробітника (код + PIN) і тестовий вхід
  - name: courses
    description: Проходження курсу в плеєрі
  - name: notifications
    description: Центр сповіщень, вподобання, Telegram у профілі
  - name: profile
    description: Фото профілю
  - name: push
    description: Web Push підписки
  - name: manager
    description: Кабінет керівника
  - name: admin
    description: Адмінка (`admin_session`, один спільний пароль)
  - name: data
    description: Жива Excel-книга (Power Query) — зовнішній контракт
  - name: telegram
    description: Бот і Mini App — зовнішній контракт
  - name: system
    description: Cron і перевірка здоров'я

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Сесія співробітника після входу кодом + PIN (lib/session.js). Підписана, зі sessionVersion — адмін може відкликати.
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
      description: Окремий вхід в /admin по ADMIN_PASSWORD (lib/adminSession.js), не пов'язаний із співробітником.
    superAdminSession:
      type: apiKey
      in: cookie
      name: admin_session
      description: admin_session рівня "super" (SUPER_ADMIN_PASSWORD).
    apiToken:
      type: http
      scheme: bearer
      description: Токен Power Query, виданий в /admin (AdminApiToken). Власник має бути активним admin/hr_manager.
    cronSecret:
      type: http
      scheme: bearer
      description: CRON_SECRET — Vercel Cron підставляє його сам.
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: TELEGRAM_WEBHOOK_SECRET, заданий при реєстрації webhook.

  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: Slug курсу
    idPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: Невалідне тіло або параметри
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Немає валідної сесії / ключа
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Сесія є, але роль не дозволяє
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Не знайдено (або не належить цій людині)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Конфлікт стану
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Ok:
      description: Успіх (JSON)
      content: { application/json: { schema: { type: object } } }
    Created:
      description: Створено
      content: { application/json: { schema: { type: object } } }
    Xlsx:
      description: Файл Excel
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    EnrollmentStatus:
      type: string
      enum: [not_started, in_progress, completed, overdue]
    DataEmployee:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        externalCode: { type: [string, "null"] }
        email: { type: [string, "null"] }
        role: { type: string, enum: [employee, manager, admin, hr_manager] }
        isActive: { type: boolean }
        managerId: { type: [integer, "null"] }
        positionCode: { type: [string, "null"] }
        positionName: { type: [string, "null"] }
        territoryName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        firstLoginAt: { type: [string, "null"], format: date-time }
      required: [id, name, externalCode, email, role, isActive, managerId, positionCode, positionName, territoryName, createdAt, firstLoginAt]
    DataCourse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: [string, "null"] }
        isMandatory: { type: boolean }
        deadlineDays: { type: [integer, "null"] }
        publishAt: { type: [string, "null"], format: date-time }
      required: [id, title, category, isMandatory, deadlineDays, publishAt]
    DataEnrollment:
      type: object
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        courseId: { type: integer }
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
        scorePercent: { type: [integer, "null"] }
        passed: { type: [boolean, "null"] }
        assignedAt: { type: string, format: date-time }
        dueDate: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        durationSeconds: { type: [integer, "null"] }
      required: [id, employeeId, courseId, status, scorePercent, passed, assignedAt, dueDate, completedAt, durationSeconds]
    Health:
      type: object
      description: Анонімно — лише ok. Деталі — тільки з admin_session.
      properties:
        ok: { type: boolean }
        db: { type: boolean }
        lastMigration: { type: [string, "null"] }
        push: { type: boolean }
        telegram: { type: boolean }
        demoLogin: { type: boolean }
        env: { type: string }
        ms: { type: integer }
      required: [ok]
    AnswerRequest:
      type: object
      description: Порожнє тіло `{}` — прогрів функції з плеєра (404 без запису).
      properties:
        enrollmentId: { type: integer }
        moduleId: { type: integer }
        componentId: { type: integer }
        response:
          type: object
          description: |
            Сира відповідь, ≤ 4000 символів JSON. Ключі — непрозорі HMAC з publicContent:
            quiz `{selected: [key]}`, ordering `{order: [key]}`,
            matching `{links: {leftKey: rightKey}}`, hotspot `{x, y, aspect}` (відсотки кадру).
      required: [enrollmentId, moduleId, componentId, response]
    AnswerResult:
      type: object
      properties:
        ok: { type: boolean, const: true }
        correct: { type: boolean }
        alreadyAnswered: { type: boolean, description: Відповідь на це питання в цій спробі вже була — повертається записана. }
        response: { type: object }
        reveal:
          type: object
          description: Розбір. Повний — лише після правильної відповіді; після помилки — лише пояснення до обраного варіанта.
      required: [ok, correct, alreadyAnswered, response, reveal]
    ModuleCompleteRequest:
      type: object
      properties:
        enrollmentId: { type: integer }
        moduleId: { type: integer }
        clientAttemptId: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$", description: UUID з браузера; повтор повертає вже записаний результат. }
        answers:
          type: object
          additionalProperties: { type: object }
          description: "Відповіді, дані без мережі, `{componentId: response}` — перевіряються тут."
        durationSeconds: { type: integer, minimum: 0 }
      required: [enrollmentId, moduleId, clientAttemptId]
    CourseState:
      type: object
      properties:
        completed: { type: boolean }
        scoreRaw: { type: integer }
        scoreMax: { type: integer }
        scorePercent: { type: integer }
        passed: { type: boolean }
        pointsEarned: { type: integer, description: "Бали за це складання (0 — курс уже був складений раніше або не складено)." }
      required: [completed, scoreRaw, scoreMax, scorePercent, passed, pointsEarned]
    ModuleCompleteResult:
      type: object
      properties:
        ok: { type: boolean, const: true }
        moduleId: { type: integer }
        attemptNumber: { type: integer }
        scoreRaw: { type: integer }
        scoreMax: { type: integer }
        scorePercent: { type: integer }
        passed: { type: boolean }
        results:
          type: array
          items:
            type: object
            properties:
              componentId: { type: integer }
              correct: { type: boolean }
        retry:
          type: object
          properties:
            canRetryNow: { type: boolean }
            attemptsLeft: { type: [integer, "null"] }
            attemptsMade: { type: integer }
            nextAttemptAt: { type: [string, "null"], format: date-time }
            waitLabel: { type: [string, "null"] }
        course:
          description: Підсумок курсу, якщо після цього модуля результат є в кожного модуля; інакше null.
          oneOf:
            - $ref: "#/components/schemas/CourseState"
            - type: "null"
      required: [ok, moduleId, attemptNumber, scoreRaw, scoreMax, scorePercent, passed, results, retry, course]
    CronResult:
      type: object
      description: Кожен крок — у власному try/catch; помилка кроку → `{error}` у його полі і статус 500.
      properties:
        overdue:
          type: object
          properties: { markedCount: { type: integer }, notifiedCount: { type: integer } }
        published:
          type: object
          properties: { publishedCount: { type: integer }, assignedCount: { type: integer } }
        toppedUp:
          type: object
          properties: { coursesChecked: { type: integer }, assignedCount: { type: integer } }
        reminders:
          type: object
          properties: { candidates: { type: integer }, created: { type: integer } }
        badges:
          type: object
          properties: { awardedCount: { type: integer } }
        digests:
          type: object
          properties: { managers: { type: integer }, created: { type: integer } }
    TelegramUpdate:
      type: object
      description: "Апдейт Bot API (https://core.telegram.org/bots/api#update). Обробляються лише текстові повідомлення в приватному чаті."
      properties:
        update_id: { type: integer }
        message:
          type: object
          properties:
            text: { type: string, description: "/start <token> — прив'язати чат, /stop — відв'язати, інше — у журнал вхідних." }
            chat:
              type: object
              properties:
                id: { type: integer }
                type: { type: string }
            from:
              type: object
              properties:
                username: { type: string }
                first_name: { type: string }

paths:
  # ------------------------------------------------------------------ auth
  /api/auth/register:
    post:
      security: []
      tags: [auth]
      summary: Крок 1 входу — знайти співробітника за кодом і надіслати PIN на пошту керівника
      description: "`demoEmail` — лише для кодів із DEMO_LOGIN_CODES (тестовий вхід), інакше 403."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                externalCode: { type: string }
                demoEmail: { type: string, format: email }
              required: [externalCode]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/auth/confirm:
    post:
      security: []
      tags: [auth]
      summary: Крок 2 входу — перевірити PIN і видати cookie-сесію
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                externalCode: { type: string }
                pin: { type: string, pattern: "^\\d{4,6}$" }
              required: [externalCode, pin]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/auth/logout:
    post:
      security: []
      tags: [auth]
      summary: Вийти — стерти cookie-сесію
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /api/auth/demo:
    get:
      security: []
      tags: [auth]
      summary: Чи увімкнено тестовий вхід і кого можна обрати (публічний, до сесії)
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # --------------------------------------------------------------- courses
  /api/courses/{slug}/answer:
    post:
      tags: [courses]
      summary: Перевірити одну відповідь на сервері й записати її в поточну спробу модуля
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/AnswerRequest" } } }
      responses:
        "200":
          description: Вердикт і розбір
          headers:
            Server-Timing: { schema: { type: string }, description: "answer;dur=<мс> — час на сервері" }
          content: { application/json: { schema: { $ref: "#/components/schemas/AnswerResult" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Модуль зараз закритий (порядок, пауза, гальмо перескладання) або питання не входить у поточну спробу
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/courses/{slug}/module-complete:
    post:
      tags: [courses]
      summary: Закрити поточну спробу модуля; бал рахує лише сервер. Закриває курс, коли результат є в кожного модуля
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ModuleCompleteRequest" } } }
      responses:
        "200":
          description: Результат модуля (і курсу, якщо закрито)
          content: { application/json: { schema: { $ref: "#/components/schemas/ModuleCompleteResult" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Модуль зараз недоступний або clientAttemptId належить іншому модулю
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/courses/{slug}/submit:
    post:
      tags: [courses]
      deprecated: true
      summary: Закрити курс (лише для старої офлайн-черги — тепер курс закриває module-complete)
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { enrollmentId: { type: integer } }
              required: [enrollmentId]
      responses:
        "200":
          description: Підсумок курсу
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  course: { $ref: "#/components/schemas/CourseState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/courses/{slug}/certificate:
    get:
      tags: [courses]
      summary: PDF-сертифікат курсу (лише складений на 100%)
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: PDF
          content: { application/pdf: { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------- notifications
  /api/notifications:
    get:
      tags: [notifications]
      summary: Стрічка сповіщень (курсор по id) + кількість непрочитаних; `?count=1` — лише лічильник для дзвіночка
      security: [{ session: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: count, in: query, schema: { type: string, enum: ["1"] }, description: "Лише {unreadCount}: одне звернення до бази, відкликана сесія бачить 0" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/notifications/read:
    post:
      tags: [notifications]
      summary: "Позначити прочитаними — `{ids}` або `{all: true}` (лише свої)"
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/notifications/preferences:
    get:
      tags: [notifications]
      summary: Вподобання сповіщень по категоріях і каналах + чи є push-підписки
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [notifications]
      summary: Змінити вподобання сповіщень
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/notifications/telegram:
    get:
      tags: [notifications]
      summary: Стан Telegram у профілі — чи прив'язано чат, deep link для «Підключити» (токен на 15 хв)
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [notifications]
      summary: Відв'язати Telegram
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -------------------------------------------------------- profile & push
  /api/profile/avatar:
    post:
      tags: [profile]
      summary: Завантажити фото профілю (multipart `file` → 256×256 WebP у Vercel Blob)
      security: [{ session: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
              required: [file]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Не вдалося зберегти у Blob }
    delete:
      tags: [profile]
      summary: Прибрати фото профілю
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/push/public-key:
    get:
      security: []
      tags: [push]
      summary: Публічний VAPID-ключ для підписки на Web Push
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /api/push/subscriptions:
    post:
      tags: [push]
      summary: Зберегти push-підписку пристрою
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [push]
      summary: Видалити push-підписку пристрою
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- manager
  /api/manager/overview:
    get:
      tags: [manager]
      summary: Агрегат кабінету керівника JSON-ом (сам кабінет рахує те саме на сервері, без цього роуту)
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/manager/team-tree:
    get:
      tags: [manager]
      summary: Дерево команди керівника (підвантажується окремо від кабінету) + рейтинг підлеглих
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/manager/hardest-questions:
    get:
      tags: [manager]
      summary: Питання, на яких команда найчастіше помиляється
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/manager/employees/{id}:
    get:
      tags: [manager]
      summary: Призначення однієї людини з команди (лише в межах підлеглих)
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/idPath" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
